services:
  zonos_tts_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zonos_tts_server
    command: [ "python3", "server.py", "--port", "8189" ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    environment:
      - PYTHONPATH=/app
      - NVIDIA_VISIBLE_DEVICES=0
      - GRADIO_SHARE=False
    networks:
      - services_network
      - dev_services_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/app/health-check.sh" ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 10s
    user: "1000:1000"
    tmpfs:
      - /tmp:rw,exec,nosuid,size=10g
      - /var/tmp:rw,exec,nosuid,size=10g
    security_opt:
      - no-new-privileges:true

networks:
  services_network:
    external: true
    name: services_network
  dev_services_network:
    external: true
    name: dev_services_network
