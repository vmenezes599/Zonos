services:
  zonos_tts_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zonos_tts_server
    command: [ "python3", "server.py", "--port", "8189" ]
    ports:
      - "8189:8189"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    environment:
      - PYTHONPATH=/app
      - ALLOWED_HOSTS=127.0.0.1,localhost
      - NVIDIA_VISIBLE_DEVICES=0
      - GRADIO_SHARE=False
    networks:
      - zonos_tts_server_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/app/health-check.sh" ]
      interval: 30s
      timeout: 3s
      retries: 3
    user: "1000:1000"
    tmpfs:
      - /tmp:rw,exec,nosuid,size=10g
      - /var/tmp:rw,exec,nosuid,size=10g
    security_opt:
      - no-new-privileges:true

networks:
  zonos_tts_server_network:
    name: zonos_tts_server_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
